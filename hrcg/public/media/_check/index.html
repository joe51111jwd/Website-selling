<!doctype html><meta charset="utf-8"><title>A5 media check (temporary)</title>
<body style="background:#0B0B0A;color:#ECE8E1;font:12px monospace">
<pre id="out">running</pre>
<script type="module">
const mod = await import('/src/media/manifest.ts');
const { media, sheetVideoPriority, isMockManifest } = mod;
const res = { mock: isMockManifest, count: Object.keys(media).length, priority: sheetVideoPriority, videos: {}, images: {}, other: {} };
const one = (fn, ms = 20000) => new Promise((r) => { const t = setTimeout(() => r({ ok: false, err: 'timeout' }), ms); fn((v) => { clearTimeout(t); r(v); }); });
for (const [id, e] of Object.entries(media)) {
  if (e.kind === 'video') {
    const out = {};
    for (const s of e.sources) {
      const can = document.createElement('video').canPlayType(s.type);
      if (!can) { out[s.src.split('.').slice(-2).join('.')] = { ok: false, err: 'canPlayType empty', type: s.type }; continue; }
      out[s.src.split('.').slice(-2).join('.')] = await one((done) => {
        const v = document.createElement('video'); v.muted = true; v.preload = 'auto'; v.playsInline = true;
        v.onloadeddata = async () => { try { await v.play(); await new Promise(r => setTimeout(r, 300)); } catch (x) {}
          done({ ok: true, w: v.videoWidth, h: v.videoHeight, dur: +v.duration.toFixed(3), t: +v.currentTime.toFixed(2), can }); v.remove(); };
        v.onerror = () => done({ ok: false, err: String(v.error && v.error.code) });
        v.src = s.src; document.body.appendChild(v);
      });
    }
    const p = await one((done) => { const i = new Image(); i.onload = () => done({ ok: true, w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => done({ ok: false }); i.src = e.poster; });
    out.poster = p;
    res.videos[id] = out;
  } else if (e.kind === 'image' || e.kind === 'matte' || (e.kind === 'svg') || e.sources[0].type === 'image/png') {
    const r = {};
    for (const s of e.sources) r[s.type] = await one((done) => { const i = new Image(); i.onload = () => done({ ok: true, w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => done({ ok: false }); i.src = s.src; });
    res.images[id] = r;
  } else {
    const rr = await fetch(e.sources[0].src); res.other[id] = { ok: rr.ok, bytes: (await rr.arrayBuffer()).byteLength };
  }
}
document.getElementById('out').textContent = JSON.stringify(res, null, 1);
window.__done = res;
</script>

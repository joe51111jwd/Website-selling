<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SmartCrew · See what every job is making, every day</title>
    <meta name="theme-color" content="#FBF8F4" />
    <link rel="icon" type="image/svg+xml" href="/src/site/assets/mark.svg" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/special-gothic-var.latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/finlandica-text-var.latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/special-gothic-figures-w104.woff2" />
    <style>
      /* first paint: the warm jobsite ground, before any JS (the hero paints on it) */
      html { background: #fbf8f4; }
      /* lab only: One Day's in-progress ground layer can show at the very top of the page while
         its owner works on it. While the hero is at the top, keep it off so the hero is judged on
         its own ground; once scrolled, One Day owns it. ?t1Day=1: leave it. */
      html.t1-top:not(.t1-day) .day-ground { opacity: 0 !important; }
      html.t1-top:not(.t1-day) .backdrop { background: #fbf8f4 !important; }
    </style>
    <script>
      (function () {
        var d = document.documentElement;
        if (/[?&]t1Day=1/.test(location.search)) d.classList.add("t1-day");
        var on = function () { d.classList.toggle("t1-top", window.scrollY < 40); };
        on();
        addEventListener("scroll", on, { passive: true });
      })();
    </script>
  </head>
  <body>
    <!-- Hero lab · t1 "The Site Model": http://127.0.0.1:5310/src/herolab/t1/dev.html
         The real page (the same scenes as src/App.tsx) with the t1 hero in place of the current one.
         ?angle=… as the page · ?t1=full|settle|rest (force the full entrance / the later-visit
         settle / the rest frame; by default the full entrance plays once per session)
         · ?t1Solo (header + hero only) · ?t1Debug (paused at t = 0; window.__t1.seek(ms) renders
         any frame, __t1.state()) · lab comparisons: ?t1Ortho=0 (the perspective camera: lands
         soft, snaps sharp) · ?t1Pad=box (the old pad ringed by its slopes) · ?t1Depth=b,a (sheets
         under / over the pad) · ?t1Move=rx:56,rz:-16,s:.76,sep:10 · ?t1Land=fall:14,cut:.12 -->
    <!-- In a production build open it at "/" (as tools/e2e.mjs does through a proxy): the build's
         relative base resolves ./models/*.glb and the logos against this nested path otherwise. -->
    <div id="root"></div>
    <script type="module" src="./dev.tsx"></script>
  </body>
</html>

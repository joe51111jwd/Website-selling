<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SmartCrew · See what every job is making, every day</title>
    <meta name="description" content="Software for dirt work contractors with 5–100 employees. GPS fills in your crew’s timecards and tags every hour to the right job, so you see each job’s profit every day." />
    <meta name="theme-color" content="#FBF8F4" />
    <meta property="og:title" content="SmartCrew · See what every job is making, every day" />
    <meta property="og:description" content="Watch one day at a 16-person dirt crew run itself: timecards, job costs, equipment, hauling, DOT and payroll in one app your crew will use." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/src/site/assets/mark.svg" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/special-gothic-var.latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/finlandica-text-var.latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/special-gothic-figures-w104.woff2" />
    <style>
      /* first paint: the warm jobsite ground, before any JS (the hero paints on it) */
      html { background: #fbf8f4; }
    </style>
    <script>
      /* the bold look (src/lib/look.ts) paints its night ground before any JS, and fetches its terrain early */
      try {
        if ((new URLSearchParams(location.search).get("look") || sessionStorage.getItem("sc-look")) === "bold") {
          document.documentElement.style.background = "#0f0d0b";
          var pre = document.createElement("link");
          pre.rel = "preload";
          pre.as = "image";
          pre.href = matchMedia("(max-width: 760px)").matches ? "bold/terrain-phone.webp" : "bold/terrain.webp";
          document.head.appendChild(pre);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
